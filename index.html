<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#11151b">
  <title>Paper.io 2 — Web Research Port</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="shell">
    <header><span class="brand">PAPER.IO 2</span><span class="status">WEB RESEARCH BUILD</span></header>

    <footer>Experimental reconstruction · no ads</footer>
  </main>
  <script src="game.js"></script>
